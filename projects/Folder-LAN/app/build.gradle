plugins { id 'com.android.application' }
android {
    namespace 'pl.folderlan.app'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.folderlan.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'] }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.hierynomus:smbj:0.15.0'
    implementation 'org.slf4j:slf4j-nop:2.0.18'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    testImplementation 'org.json:json:20250517'
    testImplementation 'junit:junit:4.13.2'
}
