name: Build Zdalny Pulpit 11 PLUS Android APK
on:
  push:
    branches:
      - build-zdalny-pulpit-11-plus-apk-20261026
    paths:
      - 'zdalnypulpit11/android/**'
      - '.github/workflows/build-zp11-plus-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: zdalnypulpit11/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and sign APK (debug key)
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZdalnyPulpit11_PLUS_Android_APK
          path: zdalnypulpit11/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error