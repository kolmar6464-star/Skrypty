      - name: Remove pairing input and enable automatic connection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/pl/folderlan/android/MainActivity.java')
          s=p.read_text()
          a=s.index('    @Override public void onCreate(Bundle state) {')
          b=s.index('    private TextView label(',a)
          s=s[:a]+'''    @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  buildUi();
                  connect();
              }
          '''+s[b:]
          s=s.replace('    private SecretVault vault;\n','').replace('    private EditText pairField;\n','')
          a=s.index('        main.addView(label("Kod parowania')
          b=s.index('        main.addView(button("Połącz',a)
          s=s[:a]+'        main.addView(label("Łączenie automatyczne — bez hasła i kodu.", 14));\n'+s[b:]
          s=s.replace('Rozłącz i zapomnij parowanie','Rozłącz')
          a=s.index('    private void connect() {')
          b=s.index('    private void refresh() {',a)
          s=s[:a]+'''    private String readPairingAsset() throws Exception {
                  byte[] buffer = new byte[128];
                  try (InputStream in = getAssets().open("pairing_key.txt")) {
                      int length = in.read(buffer);
                      if (length <= 0) throw new java.io.IOException("Missing local pairing key");
                      String value = new String(buffer, 0, length, java.nio.charset.StandardCharsets.US_ASCII).trim();
                      if (value.length() != 44) throw new java.io.IOException("Invalid pairing key length");
                      return value;
                  }
              }
              private void connect() {
                  String pairing;
                  try { pairing = readPairingAsset(); }
                  catch (Exception e) { setStatus("Błąd konfiguracji aplikacji."); return; }
                  work("Wyszukiwanie udziału Wi-Fi…", () -> {
                      LanShare next = new LanShare(pairing);
                      try { next.connect(getApplicationContext()); }
                      catch (Exception e) { next.close(); throw e; }
                      if (remote != null) remote.close();
                      remote = next;
                      currentPath = "";
                      setStatus("Połączono: " + next.hostLabel());
                      refreshInternal();
                  });
              }
          '''+s[b:]
          s=s.replace('        vault.clear(); pairField.setTag(null); pairField.setText("");\n','')
          s=s.replace('Usuwa zapisany kod parowania tylko z tego telefonu. Nie usuwa plików na komputerze.','Zamyka połączenie na telefonie. Nie usuwa plików na komputerze.')
          s=s.replace('items.removeAllViews(); currentPath = ""; setStatus("Rozłączono");','items.removeAllViews(); currentPath = ""; setStatus("Rozłączono. Dotknij Połącz, aby połączyć ponownie.");')
          p.write_text(s)
          asset=Path('app/src/main/assets/pairing_key.txt')
          asset.parent.mkdir(parents=True,exist_ok=True)
          asset.write_text('AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\n')
          b=Path('app/build.gradle')
          build=b.read_text().replace('versionCode 1','versionCode 2').replace("versionName '1.0'","versionName '2.0'")
          b.write_text(build)
          PY
