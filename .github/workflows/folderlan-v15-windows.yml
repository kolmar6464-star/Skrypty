name: Build FolderLAN v16 Awake Finder Gallery
on:
  push:
    branches: [android-folderlan-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Windows Android SDK API 35
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw "Windows Android SDK missing" }
          Write-Host "Android SDK located"
          $platform = Join-Path $sdk "platforms/android-35/android.jar"
          $buildTools = Join-Path $sdk "build-tools/35.0.0/lib/apksigner.jar"
          if (-not (Test-Path $platform) -or -not (Test-Path $buildTools)) {
            $sdkmanager = Join-Path $sdk "cmdline-tools/latest/bin/sdkmanager.bat"
            if (-not (Test-Path $sdkmanager)) { throw "No sdkmanager found under Android SDK" }
            & $sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
            if ($LASTEXITCODE -ne 0) { throw "Failed installing Android SDK packages" }
          }
      - name: Extract project from original GitHub source workflow
        run: |
          python -m pip install --quiet zstandard
          python - <<'PY'
          from pathlib import Path
          import base64,io,tarfile,zstandard
          lines=Path('.github/workflows/folderlan-apk.yml').read_text(encoding='utf-8').splitlines()
          tag="cat > /tmp/project.b64 <<'SRC'"
          begins=[i for i,line in enumerate(lines) if tag in line]
          assert len(begins)==1
          pos=begins[0]+1
          payload=[]
          while pos<len(lines) and lines[pos].strip()!="SRC":
              payload.append(lines[pos].strip())
              pos+=1
          assert pos<len(lines) and len(payload)>5
          compressed=base64.b64decode(''.join(payload))
          tar_bytes=zstandard.ZstdDecompressor().decompress(compressed,max_output_size=40_000_000)
          with tarfile.open(fileobj=io.BytesIO(tar_bytes),mode='r:') as tar:
              tar.extractall(path='.')
          assert Path('app/src/main/AndroidManifest.xml').exists()
          PY
      - name: Remove pairing input and enable automatic connection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/pl/folderlan/android/MainActivity.java')
          s=p.read_text()
          a=s.index('    @Override public void onCreate(Bundle state) {')
          b=s.index('    private TextView label(',a)
          s=s[:a]+'''    @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  buildUi();
                  connect();
              }
          '''+s[b:]
          s=s.replace('    private SecretVault vault;\n','').replace('    private EditText pairField;\n','')
          a=s.index('        main.addView(label("Kod parowania')
          b=s.index('        main.addView(button("Połącz',a)
          s=s[:a]+'        main.addView(label("Łączenie automatyczne — bez hasła i kodu.", 14));\n'+s[b:]
          s=s.replace('Rozłącz i zapomnij parowanie','Rozłącz')
          a=s.index('    private void connect() {')
          b=s.index('    private void refresh() {',a)
          s=s[:a]+'''    private String readPairingAsset() throws Exception {
                  byte[] buffer = new byte[128];
                  try (InputStream in = getAssets().open("pairing_key.txt")) {
                      int length = in.read(buffer);
                      if (length <= 0) throw new java.io.IOException("Missing local pairing key");
                      String value = new String(buffer, 0, length, java.nio.charset.StandardCharsets.US_ASCII).trim();
                      if (value.length() != 44) throw new java.io.IOException("Invalid pairing key length");
                      return value;
                  }
              }
              private void connect() {
                  String pairing;
                  try { pairing = readPairingAsset(); }
                  catch (Exception e) { setStatus("Błąd konfiguracji aplikacji."); return; }
                  work("Wyszukiwanie udziału Wi-Fi…", () -> {
                      LanShare next = new LanShare(pairing);
                      try { next.connect(getApplicationContext()); }
                      catch (Exception e) { next.close(); throw e; }
                      if (remote != null) remote.close();
                      remote = next;
                      currentPath = "";
                      setStatus("Połączono: " + next.hostLabel());
                      refreshInternal();
                  });
              }
          '''+s[b:]
          s=s.replace('        vault.clear(); pairField.setTag(null); pairField.setText("");\n','')
          s=s.replace('Usuwa zapisany kod parowania tylko z tego telefonu. Nie usuwa plików na komputerze.','Zamyka połączenie na telefonie. Nie usuwa plików na komputerze.')
          s=s.replace('items.removeAllViews(); currentPath = ""; setStatus("Rozłączono");','items.removeAllViews(); currentPath = ""; setStatus("Rozłączono. Dotknij Połącz, aby połączyć ponownie.");')
          p.write_text(s)
          asset=Path('app/src/main/assets/pairing_key.txt')
          asset.parent.mkdir(parents=True,exist_ok=True)
          asset.write_text('AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\n')
          b=Path('app/build.gradle')
          build=b.read_text().replace('versionCode 1','versionCode 2').replace("versionName '1.0'","versionName '2.0'")
          b.write_text(build)
          PY
      - name: Enable in-app gallery with select all and reliable copy
        run: |
          cp android-gallery-v3/GalleryPanel.java app/src/main/java/pl/folderlan/android/GalleryPanel.java
          python3 android-gallery-v3/patch_main.py
      - name: Add cancellation, hidden-file filtering, daily upload folders, and media library
        run: |
          python3 android-gallery-v4/patch_share.py
          python3 android-gallery-v4/patch_gallery.py
          cp android-gallery-v5/MainActivity.java app/src/main/java/pl/folderlan/android/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />', '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />')
          p.write_text(s)
          b=Path('app/build.gradle')
          s=b.read_text().replace('versionCode 3','versionCode 5').replace("versionName '3.0'","versionName '5.0'")
          b.write_text(s)
          PY
      - name: Add Find Phone foreground listener and permissions
        run: |
          cp android-gallery-v6/FindPhoneService.java app/src/main/java/pl/folderlan/android/FindPhoneService.java
          python3 android-gallery-v6/patch_finder.py
      - name: Set phone presence app version 7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace('versionCode 6', 'versionCode 7').replace("versionName '6.0'", "versionName '7.0'")
          p.write_text(s)
          PY
      - name: Repair Wi-Fi discovery and immediate SMB transfer abort
        run: python3 android-gallery-v8/patch_discovery_cancel.py
      - name: Restore connectivity after Windows reinstall or hostname change
        run: python3 android-gallery-v9/patch_auto_reconnect.py
      - name: Preserve photo selection after copying
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/pl/folderlan/android/GalleryPanel.java')
          code=p.read_text(encoding='utf-8')
          old='        selected.removeAll(successes);'
          assert code.count(old)==1, 'gallery selection state changed unexpectedly'
          code=code.replace(old, '        // Keep check marks after successful copying, so the same photos can be deleted manually.',1)
          p.write_text(code,encoding='utf-8')
          gradle=Path('app/build.gradle')
          config=gradle.read_text(encoding='utf-8')
          assert "versionCode 9" in config and "versionName '9.0'" in config
          gradle.write_text(config.replace('versionCode 9','versionCode 10').replace("versionName '9.0'","versionName '10.0'"),encoding='utf-8')
          PY
      - name: Temporarily maximize phone alarm volume while locating
        run: python3 android-gallery-v11/patch_max_alert.py
      - name: Restore gallery and enhance Find Phone lock-screen alarm
        run: |
          cp android-gallery-v12/FindPhoneAlarmActivity.java app/src/main/java/pl/folderlan/android/FindPhoneAlarmActivity.java
          python3 android-gallery-v12/patch_alarm_screen.py
      - name: Show full built-in gallery, copy all, move safely, keep checkmarks
        run: python3 android-gallery-v15/patch_all_gallery_cut.py
      - name: Keep Find Phone awake, restore visible gallery actions
        run: |
          cp android-gallery-v16/FindPhoneBootReceiver.java app/src/main/java/pl/folderlan/android/FindPhoneBootReceiver.java
          python3 android-gallery-v16/patch_finder_gallery.py
      - name: Build Android APK (Windows)
        shell: pwsh
        run: |
          gradle.bat --no-daemon :app:assembleDebug
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed" }
      - name: Collect signing utilities
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          Copy-Item (Join-Path $sdk "build-tools/35.0.0/lib/apksigner.jar") ./apksigner.jar
          Copy-Item (Join-Path $sdk "build-tools/35.0.0/zipalign.exe") ./zipalign.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FolderLAN-v16-APK-Windows-Build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apksigner.jar
            zipalign.exe
