name: Build PC Remote APK
on:
  workflow_dispatch:
  push:
    branches:
      - pc-remote-android-20261020
    paths:
      - 'PC-Remote-Android/**'
      - '.github/workflows/build-pc-remote-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode and verify source archive
        shell: bash
        run: |
          base64 --decode PC-Remote-Android/source.tar.xz.b64 > /tmp/pc-remote-source.tar.xz
          echo "5370fc6f65b69334ebd4ddb1f58c375a8406fa07450199fb191b267bc5f23aa4  /tmp/pc-remote-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/pc-remote-source.tar.xz -C PC-Remote-Android
          test -f PC-Remote-Android/app/src/main/java/pl/pcnotifier/remote/MainActivity.java
          test -f PC-Remote-Android/PC_REMOTE_BRIDGE.ps1
      - name: Build Android debug APK
        run: gradle --no-daemon -p PC-Remote-Android assembleDebug
      - name: Verify APK exists
        run: |
          test -s PC-Remote-Android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum PC-Remote-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK and Windows agent as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Remote-APK-i-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            PC-Remote-Android/app/build/outputs/apk/debug/app-debug.apk
            PC-Remote-Android/PC_REMOTE_BRIDGE.ps1
      - name: Put installable APK on dedicated repository branch
        if: github.ref == 'refs/heads/pc-remote-android-20261020'
        shell: bash
        run: |
          cp PC-Remote-Android/app/build/outputs/apk/debug/app-debug.apk PC-Remote-Android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PC-Remote-Android.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build PC Remote Android installable debug APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
