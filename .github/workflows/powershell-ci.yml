name: PowerShell — skladnia i testy
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdz skladnie wszystkich PS1 w Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = Get-ChildItem -Path scripts,tests -Recurse -Filter '*.ps1' -File
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              throw "Blad skladni w pliku $($file.FullName)"
            }
            Write-Host "OK: $($file.FullName)"
          }

      - name: Zainstaluj Pester i uruchom testy
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests -CI
