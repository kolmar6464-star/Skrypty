name: ASUS Control PL 0.7 APK (szyfrowane hasło)
on:
  push:
    branches:
      - asus-control-pl-zapis-hasla-v07-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: asus-control-pl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          command -v sdkmanager || true
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ASUS_Control_PL_v0_7_ZAPIS_HASLA_APK
          path: asus-control-pl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
